<script>
  // 1. 掃描器邏輯 (💡 在此整合：不設限讀取！掃到飲水機自動轉彎)
 function startScanner() {
    const readerDiv = document.getElementById('reader');
    readerDiv.classList.remove('hidden'); 
    
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 200 },
      (decodedText) => {
        html5QrCode.stop().then(() => {
            readerDiv.classList.add('hidden'); 
            
            // 🎯 【核心修正：讓掃描器可以讀取並判別飲水機】
            let upperText = decodedText.trim().toUpperCase();
            
            // 如果同仁掃到的條碼或網址包含 "WD" (飲水機)，直接幫他轉向去妳的飲水機點檢系統網址
            if (upperText.includes("WD")) {
               let cleanWdId = decodedText;
               if (decodedText.includes('id=')) {
                  cleanWdId = decodedText.split('id=')[1].split('&')[0];
               }
               // 🚀 請把下面的網址換成妳實際「飲水機系統」的網址即可
               window.location.href = "https://amyjacky1938-star.github.io/water-check/?id=" + cleanWdId;
               return; // 攔截跳出，不執行下面的消防邏輯
            }

            // 🚒 如果不是飲水機，則維持原來的消防點檢處理
            let cleanId = decodedText;
            if (decodedText.includes('id=')) {
               cleanId = decodedText.split('id=')[1].split('&')[0];
            }
            window.location.href = window.location.pathname + "?id=" + cleanId;
        });
      },
      (errorMessage) => { }
    ).catch(err => alert("無法開啟相機：" + err));
  } 
 
  // 2. 設備清單設定
  let selectedAbnormalItems = new Set();
 const deviceConfigs = {
   "DCP": { name: "乾粉滅火器", items: ["鋼瓶無鏽蝕變形", "皮管無堵塞斷裂", "安全插銷已固定", "壓力表指針在綠區", "前方無障礙物且在效期內"], ab: ["壓力不足", "插銷遺失", "藥劑過期", "瓶身鏽蝕", "皮管破損"] },
   "CO2": { name: "二氧化碳滅火器", items: ["鋼瓶無鏽蝕變形", "喇叭噴嘴無裂損", "安全插銷已固定", "重量已有標示", "前方無障礙物"], ab: ["重量未標示", "插銷遺失", "噴嘴裂損", "前方堆放雜物"] },
   "FH": { name: "消防栓", items: ["箱門前應淨空", "箱門完整可開關", "水帶無破損", "水瞄可轉動"], ab: ["箱體損壞", "水帶缺少或破裂", "水瞄不能轉動", "開關漏水", "前方堆放雜物"] },
   "EP": { name: "緩降機", items: ["器具完整無短缺", "支架固定良好", "操作方法標示清楚", "下降空間無阻擋"], ab: ["支架鬆動", "繩索受潮或不符合樓層高度", "操作方式標示不清", "下降空間受阻"] }
  };
 
 function getInspectedKey(eqId) {
   const now = new Date();
   return `inspected_${eqId}_${now.getFullYear()}_${now.getMonth() + 1}`;
  }
 
  if (typeof window.memoryDoneList === 'undefined') {
   window.memoryDoneList = new Set();
  }
 
 function findDataInRaw(rawData, targetId, fieldName) {
   if (!rawData) return "";
    
   if (typeof rawData === 'string' && !rawData.startsWith('{') && !rawData.startsWith('[')) {
     return rawData.trim();
    }
    
   let objList = [];
   try {
     if (typeof rawData === 'string') {
       objList = JSON.parse(rawData);
     } else {
       objList = rawData;
     }
    } catch(e) { return String(rawData); }
    
   if (!Array.isArray(objList)) {
     objList = [objList];
    }
    
   const cleanTarget = String(targetId).trim().toUpperCase();
   const matched = objList.find(item => {
     if (!item) return false;
     const itemId = String(item.設備編號 || item.EquipmentId || "").trim().toUpperCase();
     return itemId === cleanTarget;
   });
    
   if (matched) {
     return matched[fieldName] || matched.廠區位置 || matched.正確位置 || matched.效期 || matched.有效期限 || "";
    }
    
   if (objList.length > 0 && objList[0]) {
     return objList[0][fieldName] || objList[0].廠區位置 || objList[0].正確位置 || objList[0].效期 || "";
    }
    
   return "";
  }
 
  // 3. 頁面初始化載入
 window.onload = async () => {
   const savedName = localStorage.getItem('inspector');
   if (savedName) document.getElementById('inspector').value = savedName;
    
   const urlParams = new URLSearchParams(window.location.search);
   let eqId = urlParams.get('id');
 
   if (eqId) {
     document.getElementById('displayId').innerText = eqId;
     document.getElementById('displayId').classList.remove('text-red-500');
     
     let type = eqId.includes("CO2") ? "CO2" : eqId.includes("FH") ? "FH" : eqId.includes("EP") ? "EP" : "DCP";
     const config = deviceConfigs[type];
     
     const typeNameEl = document.getElementById('deviceTypeName');
     if (typeNameEl) typeNameEl.innerText = config.name;
     
     document.getElementById('items').innerHTML = config.items.map(i => `
       <li class="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-100">
         <span class="text-green-500 font-black">✓</span>
         <span class="text-[12px] font-bold text-slate-600">${i}</span>
       </li>
     `).join('');
     
     document.getElementById('abnormalChips').innerHTML = config.ab.map(a => `
       <button onclick="toggleChip(this)" class="chip px-3 py-2 bg-white rounded-lg text-[11px] font-bold text-red-600">${a}</button>
     `).join('');
 
     let isAlreadyInspected = false; 
     if (window.memoryDoneList.has(eqId)) isAlreadyInspected = true;
     try {
       if (localStorage.getItem(getInspectedKey(eqId)) === 'true') isAlreadyInspected = true;
     } catch(e) {}
 
     if (isAlreadyInspected) {
       lockUI(eqId);
       return;
     }
     
     document.getElementById('mainUI').classList.remove('hidden');
 
     const infoBox = document.getElementById('infoContainer');
     if (infoBox) {
       infoBox.classList.remove('hidden');
       document.getElementById('deviceLocation').innerText = "雲端位置讀取中...";
     }
 
     const expiryRowEl = document.getElementById('expiryRow');
     if (expiryRowEl) {
       if (type === "DCP") {
         expiryRowEl.classList.remove('hidden');
         document.getElementById('deviceExpiryDate').innerText = "雲端效期讀取中...";
       } else {
         expiryRowEl.classList.add('hidden');
       }
     }
 
     try {
       const res = await fetch(READ_API, { method: 'POST', body: JSON.stringify({}) });
       if (res.ok) {
         const data = await res.json().catch(() => ({}));
         
         let backendDoneList = data && data.doneList ? data.doneList : [];
         let rawStringData = JSON.stringify(backendDoneList).toUpperCase();
         let cleanEqId = String(eqId).trim().toUpperCase();
 
         if (rawStringData.includes(cleanEqId)) {
           lockUI(eqId);
           return;
         }
         
         let locText = "";
         if (data && data.deviceLocation) {
           locText = findDataInRaw(data.deviceLocation, eqId, "廠區位置");
         }
         if (!locText && data && data.deviceDetails) {
           locText = findDataInRaw(data.deviceDetails, eqId, "廠區位置");
         }
         document.getElementById('deviceLocation').innerText = locText || '總表未註記位置';
 
         if (type === "DCP") {
           let expiryText = "";
           if (data && data.deviceDetails) {
              expiryText = findDataInRaw(data.deviceDetails, eqId, "效期");
           }
           if (!expiryText && data && data.warningList) {
              expiryText = findDataInRaw(data.warningList, eqId, "效期");
           }
           document.getElementById('deviceExpiryDate').innerText = expiryText ? String(expiryText).substring(0, 10) : "2026-06-01";
         }
       } else {
         document.getElementById('deviceLocation').innerText = "雲端連線中";
         if (type === "DCP") document.getElementById('deviceExpiryDate').innerText = "2026-06-01";
       }
     } catch (e) {
       console.error("解讀失敗:", e);
       document.getElementById('deviceLocation').innerText = "總表未註記位置";
       if (type === "DCP") document.getElementById('deviceExpiryDate').innerText = "2026-06-01";
     }
   }
 };
 
 function lockUI(eqId) {
   document.getElementById('mainUI').innerHTML = `
      <div class="flat-card text-center py-8 border-2 border-yellow-500 bg-yellow-50/50 my-4">
        <p class="text-5xl mb-3">🛑</p>
        <p class="text-base font-black text-slate-800">此設備本月已完成點檢</p>
        <p class="text-xs text-slate-500 mt-2 font-mono bg-white/80 py-1 px-3 rounded-md inline-block border border-slate-200">${eqId}</p>
        <div class="block">
          <button onclick="window.location.href=window.location.pathname" class="mt-6 bg-blue-600 text-white text-xs font-black px-5 py-2.5 rounded-xl shadow-md">
            🔄 返回重新掃描
          </button>
        </div>
      </div>
   `;
   document.getElementById('mainUI').classList.remove('hidden');
   if (document.getElementById('infoContainer')) {
     document.getElementById('infoContainer').classList.add('hidden');
    }
  }
 
  async function fetchDashboardData() {
    const btn = document.getElementById('refreshBtn');
    if (btn) btn.classList.add('animate-spin-custom');
    
    let data = { doneList: [], errorList: [], warningList: [], deviceDetails: [] };
    
    try {
      const res = await fetch(READ_API, { method: 'POST', body: JSON.stringify({}) });
      if (res.ok) {
        const parsed = await res.json().catch(() => null);
        if (parsed) data = parsed;
      }
    } catch (e) { 
      console.error("看板抓取失敗:", e); 
    }

    const activeErrors = data.errorList || [];

    let allDevices = data.deviceDetails || [];
    let j1Total = allDevices.filter(d => String(d.設備編號 || '').toUpperCase().startsWith('J1')).length || 115;
    let j2Total = allDevices.filter(d => String(d.設備編號 || '').toUpperCase().startsWith('J2')).length || 62;
    let j3Total = allDevices.filter(d => String(d.設備編號 || '').toUpperCase().startsWith('J3')).length || 99;
    
    const factoryConfigs = [ 
      { id: 'J1', key: 'j1', total: j1Total }, 
      { id: 'J2', key: 'j2', total: j2Total }, 
      { id: 'J3', key: 'j3', total: j3Total } 
    ];

    const dynamicTotal = j1Total + j2Total + j3Total;
    const statTotalEl = document.getElementById('stat-total');
    const statPendingEl = document.getElementById('stat-pending');

    const cleanDoneCounts = { j1: 0, j2: 0, j3: 0 };
    const monthlyDoneString = data.doneList ? JSON.stringify(data.doneList).toUpperCase() : '';

    document.getElementById('factory-progress').innerHTML = factoryConfigs.map(f => {
      let done = 0;
      let factoryDeviceIds = allDevices.map(d => String(d.設備編號 || '').toUpperCase()).filter(id => id.startsWith(f.id));

      if (factoryDeviceIds.length > 0) {
        factoryDeviceIds.forEach(id => {
          let isFound = monthlyDoneString.includes(id);
          if (!isFound && data.errorList) {
            const repairItem = data.errorList.find(e => String(e.設備編號 || '').toUpperCase() === id);
            if (repairItem) {
              const rDate = String(repairItem.完成改善日期 || '').trim();
              const prog = String(repairItem.改善進度 || repairItem.狀態 || '').trim();
              if (rDate.length > 0 && rDate !== 'undefined' && rDate !== 'null' || prog.includes('Macro') || prog.includes('已改善')) {
                isFound = true;
              }
            }
          }
          if (isFound) done++;
        });
      } else {
        for (let num = 1; num <= f.total; num++) {
          const paddedNum = String(num).padStart(3, '0'); 
          const checkKeys = [`${f.id}-DCP-${paddedNum}`, `${f.id}-CO2-${paddedNum}`, `${f.id}-FH-${paddedNum}`, `${f.id}-EP-${paddedNum}`];
          let isFound = checkKeys.some(key => monthlyDoneString.includes(key));
          if (!isFound && data.errorList) {
            const repairItem = data.errorList.find(e => checkKeys.includes(String(e.設備編號 || '').toUpperCase()));
            if (repairItem) {
              const rDate = String(repairItem.完成改善日期 || '').trim();
              const prog = String(repairItem.改善進度 || repairItem.狀態 || '').trim();
              if (prog.includes('Ref') || rDate.length > 0 && rDate !== 'undefined' && rDate !== 'null' || prog.includes('Macro')) {
                isFound = true;
              }
            }
          }
          if (isFound) done++;
        }
      }

      cleanDoneCounts[f.key] = Math.max(0, Math.min(done, f.total));

      return `<div><div class="flex justify-between text-[11px] font-bold mb-1"><span>${f.id} 廠區</span><span class="text-blue-600">${cleanDoneCounts[f.key]} / ${f.total}</span></div><div class="progress-bar"><div class="progress-fill" style="width: 0%;"></div></div></div>`;
    }).join('');

    setTimeout(() => {
      const bars = document.querySelectorAll('.progress-fill');
      factoryConfigs.forEach((f, i) => {
        const done = cleanDoneCounts[f.key];
        const percent = Math.min(Math.round((done / f.total) * 100), 100);
        if (bars[i]) bars[i].style.width = percent + '%';
      });
    }, 200);

    const expiryItems = (data.warningList || []).filter(i => i && i.設備編號 && String(i.設備編號).includes("DCP"));
    document.getElementById('stat-expiry-count').innerText = expiryItems.length;
    document.getElementById('expiry-list').innerHTML = expiryItems.map(e => `
      <div class="flex justify-between border-b border-slate-50 pb-1">
        <span class="font-bold font-mono">${e.設備編號}</span>
         <span class="text-yellow-600 font-bold">${String(e.效期 || '').substring(0, 10)}</span>
      </div>
    `).join('') || "目前無過期警示";
      
    document.getElementById('stat-error-count').innerText = activeErrors.length;
    document.getElementById('error-list').innerHTML = activeErrors.map(e => {
      let locText = e.廠區位置 || e.正確位置 || "";
      if (typeof locText === 'object') locText = locText.廠區位置 || locText.正確位置 || "";
      
      const rDate = String(e.接收異常日期 || '').trim();
      const cDate = String(e.完成改善日期 || '').trim();
      
      const receiveText = (rDate && rDate !== 'undefined' && rDate !== 'null') ? rDate : '未受理';
      const completeText = (cDate && cDate !== 'undefined' && cDate !== 'null') ? `<span class="text-green-600 font-black">${cDate}</span>` : '<span class="text-red-500">處理中</span>';

      return `
        <div class="border-b border-slate-100 pb-2 mb-2 bg-slate-50/50 p-2 rounded-lg">
          <div class="flex justify-between text-[11px] mb-0.5">
            <span class="font-black text-slate-800 font-mono">設備編號：${e.設備編號 || '未知'}</span>
            <span class="font-black text-slate-500">正確位置：<span class="text-blue-600 font-mono">${locText || '未註記'}</span></span>
          </div>
          <div class="text-red-600 font-bold text-[11px] mb-1">異常項目：<span>${e.異常項目 || e.損壞備註 || e.備註 || '損壞'}</span></div>
          
          <div class="flex gap-4 text-[10px] text-slate-500 font-medium border-t border-slate-100 pt-1 mt-1">
            <div>📩 接收日期：<span class="font-mono text-slate-700">${receiveText}</span></div>
            <div>🛠️ 改善日期：<span class="font-mono">${completeText}</span></div>
          </div>
        </div>
      `;
    }).join('') || "目前全數正常";

    const realJ1 = cleanDoneCounts.j1 || 0;
    const realJ2 = cleanDoneCounts.j2 || 0;
    const realJ3 = cleanDoneCounts.j3 || 0;
    const realTotalDone = realJ1 + realJ2 + realJ3;
    const correctPending = dynamicTotal - realTotalDone;

    if (statTotalEl) statTotalEl.innerText = dynamicTotal;
    if (statPendingEl) statPendingEl.innerText = correctPending;

    if (btn) btn.classList.remove('animate-spin-custom');
  }
 
 function toggleChip(btn) {
   const item = btn.innerText;
   if (selectedAbnormalItems.has(item)) {
selectedAbnormalItems.delete(item); btn.classList.remove('selected'); }
   else { selectedAbnormalItems.add(item); btn.classList.add('selected'); }
  }
 
 async function submitData(status) {
   if (isSubmitting) return; 
 
   const inspector = document.getElementById('inspector').value;
   if (!inspector) { alert('請填寫姓名！'); return; }
   localStorage.setItem('inspector', inspector);
 
   const eqId = document.getElementById('displayId').innerText;
   const localKey = getInspectedKey(eqId);
 
   if (window.memoryDoneList.has(eqId)) {
      alert('🛑 此設備剛才已完成點檢！');
      lockUI(eqId);
      return;
    }
 
   isSubmitting = true; 
    
   const payload = { 
     equipmentId: eqId, 
     inspector, 
     status, 
     reason: status === '異常' ? Array.from(selectedAbnormalItems).join(',') + ' ' + document.getElementById('reason').value : '無', 
     timestamp: new Date().toLocaleString() 
   };
    
   document.getElementById('msg').classList.remove('hidden');
   document.getElementById('statusText').innerText = "上傳中...";
    
   try {
     const response = await fetch(WEBHOOK_URL, { 
       method: 'POST', 
       headers: { 'Content-Type': 'application/json' }, 
       body: JSON.stringify(payload)
     });
     
     if (response.ok) { 
       window.memoryDoneList.add(eqId); 
       try { localStorage.setItem(localKey, 'true'); } catch(e) {}
       document.getElementById('statusText').innerText = "資料已同步"; 
     } else { 
       alert("伺服器端發生錯誤");
       document.getElementById('msg').classList.add('hidden');
       isSubmitting = false; 
     }
    } catch (e) { 
     alert("網路解讀失敗");
     document.getElementById('msg').classList.add('hidden');
     isSubmitting = false; 
    }
  }
 
 function showPage(page) {
   document.getElementById('pageCheck').classList.toggle('hidden', page !== 'check');
   document.getElementById('pageDash').classList.toggle('hidden', page !== 'dash');
   document.getElementById('btnCheck').classList.toggle('active', page === 'check');
   document.getElementById('btnDash').classList.toggle('active', page === 'dash');
   if (page === 'dash') fetchDashboardData();
  }
  
  let isSubmitting = false;
  function showAbnormal() { document.getElementById('abnormalForm').classList.toggle('hidden'); }
</script>
